name: Build APK

# Push this repo to GitHub (private is fine) and every push builds a
# ready-to-install APK: Actions tab -> latest run -> Artifacts -> relay-apk.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK (signed with the debug key)
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: relay-apk
          path: app/build/outputs/apk/release/app-release.apk
