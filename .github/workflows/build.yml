name: Build APKs
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon :dial:connectedDebugAndroidTest || true
            adb logcat -d -v brief | grep -E "DIALPROBE|MediaHTTPConnection|GenericSource|NuPlayer |NuCachedSource|MediaExtractor|AACExtractor|MediaPlayerNative|MediaPlayer *:|NuPlayerDriver|StagefrightMetadata|MediaCodec.*(E|W)/" | grep -v "^D/" | tail -400 > /tmp/media.log || true
            echo "===== PROBE RESULTS"; grep DIALPROBE /tmp/media.log || true
            echo "===== FRAMEWORK MEDIA LOG"; grep -v DIALPROBE /tmp/media.log | cut -c1-300 | tail -200 || true
