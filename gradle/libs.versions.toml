# One place for every version in the build. Modules refer to these as
# `libs.<name>`; the shared app setup in build-logic/ reads them too.

[versions]
agp = "9.3.1"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
core-ktx = "1.19.0"
lifecycle = "2.11.0"
media3 = "1.11.1"
litertlm = "0.19.1"
zstd-jni = "1.5.6-9"
junit = "4.13.2"

# Android SDK levels shared by the Field apps and the :field library.
# compileSdk is 37.1 (API level 37, minor 1): what the current Compose needs.
compile-sdk = "37"
compile-sdk-minor = "1"
target-sdk = "36"
min-sdk = "26"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
litertlm-jvm = { module = "com.google.ai.edge.litertlm:litertlm-jvm", version.ref = "litertlm" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
junit = { module = "junit:junit", version.ref = "junit" }

# Gradle plugins as libraries: build-logic/ compiles against them.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
